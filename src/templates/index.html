<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente de Productores v2</title>
<style>
  :root {
    --bg: #0e0e14; --panel: #17171f; --panel-2: #1e1e28; --border: #2a2a36;
    --text: #f2f2f5; --muted: #9a9aab; --accent: #a855f7; --accent-2: #c084fc;
    --danger: #f59e0b; --ok: #34d399;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { padding: 28px 32px 20px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; }
  header h1 span { color: var(--accent-2); }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { background: var(--panel); border: 1px solid var(--border); color: var(--muted); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tab.activo { background: var(--accent); color: #fff; border-color: var(--accent); }
  .buscador { display: flex; gap: 10px; margin-bottom: 20px; }
  .buscador input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 10px; font-size: 15px; outline: none; }
  .buscador input:focus { border-color: var(--accent); }
  .buscador button { background: var(--accent); color: #fff; border: none; padding: 12px 22px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .buscador button:hover { background: var(--accent-2); }
  .buscador button:disabled { opacity: 0.6; cursor: default; }
  .estado { color: var(--muted); font-size: 14px; margin-bottom: 16px; min-height: 20px; }
  .alerta { background: rgba(245, 158, 11, 0.12); border: 1px solid var(--danger); color: #fcd34d; padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 20px; }
  .bloque { background: var(--panel-2); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; margin-bottom: 24px; }
  .bloque > h2 { margin: 0 0 16px; font-size: 18px; }
  .seccion { margin-bottom: 20px; }
  .seccion-titulo { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; color: var(--accent-2); font-weight: 600; }
  .card p { margin: 0; font-size: 13px; color: var(--text); line-height: 1.5; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgba(168, 85, 247, 0.15); color: var(--accent-2); margin-bottom: 6px; }
  .badge.ok { background: rgba(52, 211, 153, 0.15); color: var(--ok); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .campo { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 13px; border-top: 1px solid var(--border); }
  .campo:first-of-type { border-top: none; }
  .campo .k { color: var(--muted); }
  .campo .v { text-align: right; word-break: break-word; }
  .noticia { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; }
  .noticia .titulo { font-size: 13px; margin-bottom: 4px; }
  .noticia .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .noticia a { color: var(--accent-2); font-size: 12px; text-decoration: none; }
  .noticia a:hover { text-decoration: underline; }
  .vacio { color: var(--muted); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Agente de <span>Productores v2</span></h1>
  <p>CRM (Firebase) + noticias públicas — 100% código, sin llamadas a un LLM</p>
</header>

<main>
  <div class="tabs">
    <div class="tab activo" data-modo="cliente">Cliente</div>
    <div class="tab" data-modo="productor">Agente Productor</div>
    <div class="tab" data-modo="comercial">Comercial</div>
  </div>

  <div class="buscador">
    <input id="nombre" type="text" placeholder="Nombre del cliente" autofocus>
    <button id="btnBuscar">Buscar</button>
  </div>
  <div class="estado" id="estado"></div>
  <div id="resultado"></div>
</main>

<script>
const tabs = document.querySelectorAll(".tab");
const input = document.getElementById("nombre");
const boton = document.getElementById("btnBuscar");
const estado = document.getElementById("estado");
const resultado = document.getElementById("resultado");

const PLACEHOLDERS = { cliente: "Nombre del cliente", productor: "Nombre del agente productor", comercial: "Nombre del comercial" };
let modo = "cliente";

tabs.forEach(tab => tab.addEventListener("click", () => {
  tabs.forEach(t => t.classList.remove("activo"));
  tab.classList.add("activo");
  modo = tab.dataset.modo;
  input.placeholder = PLACEHOLDERS[modo];
  resultado.innerHTML = ""; estado.textContent = ""; input.value = ""; input.focus();
}));

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderNoticias(noticias) {
  if (!noticias || !noticias.length) return `<div class="seccion"><div class="seccion-titulo">Noticias públicas</div><div class="vacio">Sin noticias.</div></div>`;
  const items = noticias.map(n => `
    <div class="noticia">
      <div class="titulo">${escapeHtml(n.title)}</div>
      <div class="meta">${escapeHtml(n.source)} · ${escapeHtml(n.date)}</div>
      <a href="${n.link}" target="_blank" rel="noopener">Ver noticia →</a>
    </div>`).join("");
  return `<div class="seccion"><div class="seccion-titulo">Noticias públicas</div>${items}</div>`;
}

function renderCliente(r) {
  let html = `<div class="bloque"><h2>${escapeHtml(r.cliente)}</h2>`;
  if (r.noticias && r.noticias.length) {
    html += `<div class="alerta">⚠ Se encontraron ${r.noticias.length} noticia(s) públicas — revisar antes de la reunión.</div>`;
  }
  html += `<div class="seccion"><div class="seccion-titulo">Cuentas</div><div class="grid">${r.cuentas.map(c => `
    <div class="card">
      <h3>Cuenta ${escapeHtml(c.numeroCuenta)}</h3>
      <div class="campo"><span class="k">Agente Productor</span><span class="v">${escapeHtml(c.agente_productor)}</span></div>
      <div class="campo"><span class="k">Comercial</span><span class="v">${escapeHtml(c.comercial)}</span></div>
    </div>`).join("")}</div></div>`;
  html += `<div class="seccion"><div class="seccion-titulo">Calificación</div>`;
  html += r.calificaciones.length
    ? `<div class="grid">${r.calificaciones.map(c => `
        <div class="card"><span class="badge ${c.etapa === 'Calificada' ? 'ok' : ''}">${escapeHtml(c.etapa)}</span><p>${escapeHtml(c.detalle)}</p></div>`).join("")}</div>`
    : `<div class="vacio">Sin proceso de calificación.</div>`;
  html += `</div>`;
  html += renderNoticias(r.noticias);
  html += `</div>`;
  return html;
}

function renderProductor(r) {
  const p = r.productor;
  let html = `<div class="bloque"><h2>${escapeHtml(p.nombre)}</h2>`;
  html += `<div class="seccion"><div class="seccion-titulo">Cuentas asignadas</div>`;
  html += r.cuentas_asignadas.length
    ? `<div class="grid">${r.cuentas_asignadas.map(c => `<div class="card"><h3>${escapeHtml(c.cliente)}</h3><p class="meta">Cuenta ${escapeHtml(c.numeroCuenta)}</p></div>`).join("")}</div>`
    : `<div class="vacio">Sin cuentas asignadas.</div>`;
  html += `</div>`;
  html += `<div class="seccion"><div class="seccion-titulo">Cuentas en calificación</div>`;
  html += r.en_calificacion.length
    ? `<div class="grid">${r.en_calificacion.map(c => `<div class="card"><span class="badge">${escapeHtml(c.etapa)}</span><h3>${escapeHtml(c.cliente)}</h3></div>`).join("")}</div>`
    : `<div class="vacio">Sin empresas en proceso de calificación.</div>`;
  html += `</div>`;
  html += `<div class="seccion"><div class="seccion-titulo">Recordatorios</div>`;
  html += r.recordatorios.length
    ? r.recordatorios.map(rec => `<div class="campo"><span class="k">${escapeHtml(rec.descripcion)}</span><span class="v">${escapeHtml(rec.fecha)}</span></div>`).join("")
    : `<div class="vacio">Sin recordatorios pendientes.</div>`;
  html += `</div></div>`;
  return html;
}

function renderComercial(r) {
  const c = r.comercial;
  let html = `<div class="bloque"><h2>${escapeHtml(c.nombre)}</h2>`;
  html += `<div class="seccion"><div class="seccion-titulo">Agentes Productores asociados</div>`;
  html += r.agentes_productores.length
    ? `<div class="chips">${r.agentes_productores.map(n => `<span class="chip">${escapeHtml(n)}</span>`).join("")}</div>`
    : `<div class="vacio">Sin agentes productores asignados.</div>`;
  html += `</div>`;
  html += `<div class="seccion"><div class="seccion-titulo">Pendientes</div>`;
  html += r.pendientes.length
    ? r.pendientes.map(pe => `<div class="campo"><span class="k">${escapeHtml(pe.descripcion)}</span><span class="v">${pe.completado ? "hecho" : "pendiente"}</span></div>`).join("")
    : `<div class="vacio">Sin pendientes.</div>`;
  html += `</div>`;
  html += `<div class="seccion"><div class="seccion-titulo">Recordatorios</div>`;
  html += r.recordatorios.length
    ? r.recordatorios.map(rec => `<div class="campo"><span class="k">${escapeHtml(rec.mensaje)}</span><span class="v">${escapeHtml(rec.fecha)} · ${rec.completado ? "hecho" : "pendiente"}</span></div>`).join("")
    : `<div class="vacio">Sin recordatorios.</div>`;
  html += `</div>`;
  html += `<div class="seccion"><div class="seccion-titulo">Aperturas (≠ Finalizada)</div>`;
  html += r.aperturas.length
    ? `<div class="grid">${r.aperturas.map(a => `<div class="card"><span class="badge">${escapeHtml(a.estado)}</span><h3>${escapeHtml(a.cliente)}</h3><p class="meta">Productor: ${escapeHtml(a.agente_productor)}</p></div>`).join("")}</div>`
    : `<div class="vacio">Sin aperturas en curso.</div>`;
  html += `</div>`;
  html += `<div class="seccion"><div class="seccion-titulo">Calificaciones</div>`;
  html += r.calificaciones.length
    ? `<div class="grid">${r.calificaciones.map(cc => `<div class="card"><span class="badge ${cc.etapa === 'Calificada' ? 'ok' : ''}">${escapeHtml(cc.etapa)}</span><h3>${escapeHtml(cc.cliente)}</h3><p class="meta">${escapeHtml(cc.agente_productor_o_texto)}</p></div>`).join("")}</div>`
    : `<div class="vacio">Sin empresas en proceso de calificación.</div>`;
  html += `</div></div>`;
  return html;
}

const RENDER = { cliente: renderCliente, productor: renderProductor, comercial: renderComercial };

async function buscar() {
  const nombre = input.value.trim();
  if (!nombre) return;

  boton.disabled = true;
  estado.textContent = "Buscando...";
  resultado.innerHTML = "";

  try {
    const resp = await fetch(`/api/buscar?modo=${modo}&nombre=${encodeURIComponent(nombre)}`);
    const datos = await resp.json();

    if (!resp.ok) {
      estado.textContent = "";
      resultado.innerHTML = `<div class="alerta">${escapeHtml(datos.error || "Ocurrió un error.")}</div>`;
      return;
    }

    estado.textContent = "";

    if (!datos.encontrado) {
      resultado.innerHTML = `<div class="vacio">No se encontró ningún ${modo} que coincida con "${escapeHtml(nombre)}".</div>`;
      return;
    }

    resultado.innerHTML = datos.resultados.map(RENDER[modo]).join("");
  } catch (e) {
    estado.textContent = "";
    resultado.innerHTML = `<div class="alerta">No se pudo conectar con el servidor local.</div>`;
  } finally {
    boton.disabled = false;
  }
}

boton.addEventListener("click", buscar);
input.addEventListener("keydown", e => { if (e.key === "Enter") buscar(); });
</script>
</body>
</html>
